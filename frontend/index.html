    const closeSettings = () => $("settings").classList.remove("open");
    $("settings-btn").addEventListener("click", openSettings);
    $("settings-close").addEventListener("click", closeSettings);
    $("settings").addEventListener("click", (e) => { if (e.target === $("settings")) closeSettings(); });
    // "Folders" here switches the list into folder-grouped view, then steps aside
    $("view-folders").addEventListener("click", () => { closeSettings(); setSortMode("folders"); });
    // file the note on Enter or when you click away; picking from the datalist fires change
    $("folder").addEventListener("change", saveFolder);
    $("folder").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("folder").blur(); } });
    $("pin").addEventListener("click", togglePin);
    $("pin").addEventListener("mousedown", (e) => e.preventDefault());  // keep caret in the editor
    $("threads-btn").addEventListener("click", openThreads);
    $("threads-close").addEventListener("click", closeThreads);
    $("threads").addEventListener("click", (e) => { if (e.target === $("threads")) closeThreads(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape") { closeThreads(); closeSettings(); } });
    document.querySelectorAll(".tab").forEach(t =>
      t.addEventListener("click", () => showTab(t.dataset.tab)));

    $("history").addEventListener("click", async (e) => {
      const del = e.target.closest("[data-del]");
      if (del) {
        e.stopPropagation();
        const id = Number(del.dataset.del);
        const doomed = allNotes.find(n => n.id === id);
        const snap = doomed ? { content: doomed.content, analysis: doomed.analysis, folder: doomed.folder, pinned: doomed.pinned } : null;
        await fetch("/api/notes/" + id, { method: "DELETE" });
        if (id === current.id) newNote();
        await loadList();
        if (snap) say(T("deleted"), false, () => restoreNote(snap));
        return;
      }
      const card = e.target.closest(".note-card");
      if (card) openNote(Number(card.dataset.id));
    });

    // don't lose a thought on a fast tab-close
    window.addEventListener("beforeunload", () => {
      const content = editorGet().trim();
      if (content && content !== current.content && current.id) {
        navigator.sendBeacon?.("/api/notes/" + current.id,
          new Blob([JSON.stringify({ content })], { type: "application/json" }));
      }
    });

    /* ---------- launch ----------
       The splash waits on two things: the mark finishing its draw, and the app
       actually being ready (notes fetched). Whichever is slower decides — so
       on a slow load it's covering real work, and on a fast one it's gone in
       about a second. It is never a delay for its own sake. */
    const MIN_SPLASH = matchMedia("(prefers-reduced-motion: reduce)").matches ? 450 : 1150;

    async function boot() {
      const splash = $("splash");
      const host = $("splash-mark");

      const drawn = (async () => {
        try {
          host.innerHTML = await fetch("/logo-wide.svg").then(r => {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          });
          requestAnimationFrame(() => host.classList.add("draw"));
        } catch {
          host.innerHTML = '<img src="/logo-wide.svg" alt="">';   // never lose the logo
        }
      })();

      const ready = loadList().catch(() => {});         // the real cold start
      const floor = new Promise(r => setTimeout(r, MIN_SPLASH));

      await Promise.all([drawn, ready, floor]);
      newNote();
      // Language settles behind the splash: an Arabic speaker never sees a
      // flash of English, and the app is already mirrored when it lifts.
      // Their choice wins; otherwise follow the browser.
      let saved = null;
      try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
      const fromBrowser = (navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en";
      applyLang(saved || fromBrowser);
      if (isPhone() && allNotes.length) showListPane();
      splash.classList.add("done");
    }

    // never strand anyone behind the splash if something goes wrong
    setTimeout(() => $("splash").classList.add("done"), 4000);
    boot();
  </script>
</body>
</html>
